spring.application.name=order-serivce

server.port=8081

spring.devtools.restart.enabled=false

# C?u h?nh MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3310/order_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# ----------------------------
# Kafka
# ----------------------------
spring.kafka.bootstrap-servers=localhost:29092

# ----------------------------
# Producer Config
# ----------------------------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# B?t g?i header __TypeId__ ?? consumer bi?t deserialize ??ng class
spring.kafka.producer.properties.spring.json.add.type.headers=true

# ----------------------------
# Consumer Config
# ----------------------------
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# S? d?ng ErrorHandlingDeserializer ?? kh?ng crash khi message l?i
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
# Delegate JsonDeserializer ?? th?c s? deserialize JSON
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# Cho ph?p deserialize t?t c? class trong project
spring.kafka.consumer.properties.spring.json.trusted-packages=*

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

# jwt
jwt.access-secret=${JWT_ACCESS_SECRET_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
jwt.refresh-secret=${JWT_REFRESH_SECRET_BASE64:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXowMTIzNDU2Nzg5QUJDREVG}
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=2592000000
jwt.issuer=${JWT_ISSUER:identity-service}

# ----------------------------
# Frontend URLs
# ----------------------------
app.frontend.verify-success-url=http://localhost:3000/email-verification/success
app.frontend.verify-failure-url=http://localhost:3000/email-verification/failure
app.frontend.reset-password-url=http://localhost:3000/reset-password

# ----------------------------
# Kafka Topics
# ----------------------------
app.kafka.topics.password-reset=user-password-reset-topic
jwt.audience=${JWT_AUDIENCE:task-management-clients}
jwt.clock-skew-seconds=${JWT_CLOCK_SKEW_SECONDS:60}

# ----------------------------
# Upstream Services
# ----------------------------
app.services.user.base-url=${USER_SERVICE_URL:http://172.16.54.7:8080}
app.services.user.verify-path=${USER_VERIFY_PATH:/users/me}
app.services.food.base-url=${FOOD_SERVICE_URL:http://localhost:8082}
app.services.food.detail-path=${FOOD_DETAIL_PATH:/foods/{foodId}}